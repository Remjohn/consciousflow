[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"
  included_files = ["server/**", "src/db/**", "src/lib/**"]

# API routes → Netlify Function
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api/:splat"
  status = 200

# SPA fallback for frontend routes (MUST be last)
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Environment variables are set in Netlify Dashboard:
# - DATABASE_URL (Neon connection string)
# - MISTRAL_API_KEY
